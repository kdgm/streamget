name: Build streamget

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    # same OS and libcurl (7.88) as the streamrec image that runs streamget
    container: debian:bookworm

    steps:
      # before checkout: without git, checkout downloads an archive and GIT_REF ends up empty
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config libcurl4-openssl-dev git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: autogen
        run: ./autogen.sh
      - name: configure
        run: ./configure
      - name: make
        run: make
      - name: make check
        run: make check
      - name: make distcheck
        run: make distcheck
